name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Lint, Test and Build
    uses: ./.github/workflows/ci.yml

  build_and_deploy_job:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_SKY_084C84203 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
      - name: Post-deploy probe
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          # Retries each check for up to 90 s (18 x 5 s), then fails naming the check.
          API=https://blackjack-api-blake.azurewebsites.net/api/auth/login
          ORIGIN=https://lively-sky-084c84203.2.azurestaticapps.net
          tmp=$(mktemp -d)
          retry() { # retry <name> <fn>
            for i in $(seq 18); do "$2" && return 0; sleep 5; done
            echo "::error::Post-deploy probe failed: $1 - $msg"; exit 1
          }
          site() {
            msg="GET $SITE_URL not 200"
            [ "$(curl -s -m 10 -o "$tmp/html" -w '%{http_code}' "$SITE_URL/")" = 200 ] || return 1
            bundle=$(grep -oE 'src="/assets/[^"]+\.js"' "$tmp/html" | head -1 | cut -d'"' -f2)
            msg="index.html references no /assets/*.js bundle"
            [ -n "$bundle" ] || return 1
            # A missing file is rewritten to index.html (200), so require a JavaScript content-type.
            msg="GET $bundle not 200 with a javascript content-type"
            ct=$(curl -s -m 10 -o /dev/null -w '%{http_code} %{content_type}' "$SITE_URL$bundle")
            case "$ct" in "200 "*javascript*) ;; *) msg="$msg (got: $ct)"; return 1 ;; esac
            status=${ct%% *}
          }
          cors() {
            msg="preflight to $API returned no Access-Control-Allow-Origin equal to $ORIGIN"
            curl -s -m 10 -i -X OPTIONS "$API" -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization' |
              tr -d '\r' | grep -iqx "access-control-allow-origin: $ORIGIN"
          }
          retry SITE site
          echo "SITE ok: $SITE_URL 200, bundle $bundle $status"
          retry CORS cors
          echo "CORS ok: $API allows $ORIGIN"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
       id-token: write
       contents: read
    steps:
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_SKY_084C84203 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "close"
