name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Workflow level (#198): runs for main go one at a time, so an older commit cannot deploy over a newer one (a newer
# pending run replaces an older pending one). Per PR, a newer run, the close run included, cancels the preview run,
# even while it is still testing, so the preview is not re-created after close. A push never cancels a running deploy.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Lint, Test and Build
    uses: ./.github/workflows/ci.yml

  build_and_deploy_job:
    needs: test
    # Dependabot PRs get no repository secrets, so no preview for them. On push there is no pull_request, so this passes.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          lfs: false
      - name: Get Id Token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: idtoken
        with:
           script: |
               return await core.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_SKY_084C84203 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
      - name: Post-deploy probe
        if: github.event_name == 'push'
        env:
          # Not static_web_app_url: with "Set default domain" on, the azurestaticapps host answers 301.
          SITE_URL: https://blakejack.win
        run: |
          # Each check retries every 5 s until its own 90 s deadline, then fails naming the check and the last reason.
          API=https://blackjack-api-blake.azurewebsites.net/api/auth/login
          ORIGIN=https://blakejack.win
          tmp=$(mktemp -d)
          check() { # check <name> <fn>; fn sets $why and returns 1 on failure, $ok on success
            local start=$SECONDS end=$((SECONDS+90))
            until "$2"; do
              [ $SECONDS -lt $end ] || { echo "::error::Post-deploy probe failed: $1 - $why"; exit 1; }
              sleep 5
            done
            echo "$1 ok: $ok ($((SECONDS-start))s)"
          }
          site() {
            why="GET $SITE_URL/ not 200"
            [ "$(curl -s -m 5 -o "$tmp/html" -w '%{http_code}' "$SITE_URL/")" = 200 ] || return 1
            # First module script, else any script ending .js; may be absolute-path, relative or a full URL.
            tags=$(tr '\n' ' ' < "$tmp/html" | grep -oiE '<script[^>]*>')
            src=$(grep -i 'type="module"' <<< "$tags" | grep -oiE 'src="[^"]+"' | head -1 | cut -d'"' -f2)
            [ -n "$src" ] || src=$(grep -oiE 'src="[^"]+\.js"' <<< "$tags" | head -1 | cut -d'"' -f2)
            why="index.html has no <script type=module src> or .js script"
            [ -n "$src" ] || return 1
            case $src in
              http://*|https://*) url=$src ;;
              //*) url=https:$src ;;
              /*) url=${SITE_URL%/}$src ;;
              *) url=${SITE_URL%/}/${src#./} ;;
            esac
            # A missing file is rewritten to index.html (200), so require a JavaScript content-type.
            ct=$(curl -s -m 5 -o /dev/null -w '%{http_code} %{content_type}' "$url")
            why="GET $url not 200 with a javascript content-type (got: $ct)"
            case $ct in "200 "*javascript*) ok="$SITE_URL 200, bundle $url" ;; *) return 1 ;; esac
          }
          hdr() { grep -i "^$1:" "$tmp/h" | head -1 | cut -d: -f2- | tr -d '\r '; }
          cors() {
            why="no response from preflight to $API"
            curl -si -m 5 -X OPTIONS "$API" -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization' -o "$tmp/h" || return 1
            code=$(sed -n '1s/^HTTP[^ ]* \([0-9]*\).*/\1/p' "$tmp/h")
            case $code in 2??) ;; *) why="preflight status '$code', want 2xx"; return 1 ;; esac
            [ "$(hdr access-control-allow-origin)" = "$ORIGIN" ] ||
              { why="Access-Control-Allow-Origin is '$(hdr access-control-allow-origin)', want $ORIGIN"; return 1; }
            h=$(hdr access-control-allow-headers | tr A-Z a-z)
            case ",$h," in *,authorization,*) ;; *) why="Access-Control-Allow-Headers '$h' lacks authorization"; return 1 ;; esac
            # ASP.NET Core omits Allow-Methods for CORS-safelisted POST, so only a present header must list POST.
            m=$(hdr access-control-allow-methods | tr a-z A-Z)
            case ",$m," in ,,|*,POST,*|*,\*,*) ;; *) why="Access-Control-Allow-Methods '$m' lacks POST"; return 1 ;; esac
            ok="$API allows $ORIGIN (HTTP $code)"
          }
          check SITE site
          check CORS cors

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
       id-token: write
       contents: read
    steps:
      - name: Get Id Token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: idtoken
        with:
           script: |
               return await core.getIDToken()
           result-encoding: string
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_SKY_084C84203 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "close"

  live_smoke:
    name: Live smoke test (post-deploy alarm)
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time: two pushes to main would race on the test account's balance.
    concurrency:
      group: live-smoke
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium shell only, no browser cache (same as the e2e job in ci.yml).
      - run: bash scripts/install-playwright-browser.sh
        timeout-minutes: 4
      # SWA swaps the new build in after the deploy job ends, so the smoke test could run against the old one (#190).
      # The build is deterministic (same hash as the live site), so building here tells us which entry script to wait for.
      - name: Build, to learn the hash the deploy serves
        run: npm run build
      - run: bash scripts/wait-for-build.sh
        timeout-minutes: 4
      # The login secrets are set on this step only, so no other step can read them.
      - run: npx playwright test -c playwright.live.config.js
        timeout-minutes: 6
        env:
          E2E_LIVE_USERNAME: ${{ secrets.E2E_LIVE_USERNAME }}
          E2E_LIVE_PASSWORD: ${{ secrets.E2E_LIVE_PASSWORD }}
          CI: true
      # A text ARIA snapshot of the page at the failure (Playwright's error-context.md), no image or trace.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-smoke-snapshot
          path: test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        run: echo "::error::Post-deploy live smoke test failed - the deploy already happened; this is an alarm, not a rollback. See the failing step's log (the wait for the new build, or the smoke test)."
