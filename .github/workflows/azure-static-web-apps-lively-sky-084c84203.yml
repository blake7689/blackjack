name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Lint, Test and Build
    uses: ./.github/workflows/ci.yml

  build_and_deploy_job:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_SKY_084C84203 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
      - name: Post-deploy probe
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          # Each check retries every 5 s until its own 90 s deadline, then fails naming the check and the last reason.
          API=https://blackjack-api-blake.azurewebsites.net/api/auth/login
          ORIGIN=https://lively-sky-084c84203.2.azurestaticapps.net
          tmp=$(mktemp -d)
          check() { # check <name> <fn>; fn sets $why and returns 1 on failure, $ok on success
            local start=$SECONDS end=$((SECONDS+90))
            until "$2"; do
              [ $SECONDS -lt $end ] || { echo "::error::Post-deploy probe failed: $1 - $why"; exit 1; }
              sleep 5
            done
            echo "$1 ok: $ok ($((SECONDS-start))s)"
          }
          site() {
            why="GET $SITE_URL/ not 200"
            [ "$(curl -s -m 5 -o "$tmp/html" -w '%{http_code}' "$SITE_URL/")" = 200 ] || return 1
            # First module script, else any script ending .js; may be absolute-path, relative or a full URL.
            tags=$(tr '\n' ' ' < "$tmp/html" | grep -oiE '<script[^>]*>')
            src=$(grep -i 'type="module"' <<< "$tags" | grep -oiE 'src="[^"]+"' | head -1 | cut -d'"' -f2)
            [ -n "$src" ] || src=$(grep -oiE 'src="[^"]+\.js"' <<< "$tags" | head -1 | cut -d'"' -f2)
            why="index.html has no <script type=module src> or .js script"
            [ -n "$src" ] || return 1
            case $src in
              http://*|https://*) url=$src ;;
              //*) url=https:$src ;;
              /*) url=${SITE_URL%/}$src ;;
              *) url=${SITE_URL%/}/${src#./} ;;
            esac
            # A missing file is rewritten to index.html (200), so require a JavaScript content-type.
            ct=$(curl -s -m 5 -o /dev/null -w '%{http_code} %{content_type}' "$url")
            why="GET $url not 200 with a javascript content-type (got: $ct)"
            case $ct in "200 "*javascript*) ok="$SITE_URL 200, bundle $url" ;; *) return 1 ;; esac
          }
          hdr() { grep -i "^$1:" "$tmp/h" | head -1 | cut -d: -f2- | tr -d '\r '; }
          cors() {
            why="no response from preflight to $API"
            curl -si -m 5 -X OPTIONS "$API" -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization' -o "$tmp/h" || return 1
            code=$(sed -n '1s/^HTTP[^ ]* \([0-9]*\).*/\1/p' "$tmp/h")
            case $code in 2??) ;; *) why="preflight status '$code', want 2xx"; return 1 ;; esac
            [ "$(hdr access-control-allow-origin)" = "$ORIGIN" ] ||
              { why="Access-Control-Allow-Origin is '$(hdr access-control-allow-origin)', want $ORIGIN"; return 1; }
            h=$(hdr access-control-allow-headers | tr A-Z a-z)
            case ",$h," in *,authorization,*) ;; *) why="Access-Control-Allow-Headers '$h' lacks authorization"; return 1 ;; esac
            # ASP.NET Core omits Allow-Methods for CORS-safelisted POST, so only a present header must list POST.
            m=$(hdr access-control-allow-methods | tr a-z A-Z)
            case ",$m," in ,,|*,POST,*|*,\*,*) ;; *) why="Access-Control-Allow-Methods '$m' lacks POST"; return 1 ;; esac
            ok="$API allows $ORIGIN (HTTP $code)"
          }
          check SITE site
          check CORS cors

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
       id-token: write
       contents: read
    steps:
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_SKY_084C84203 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "close"
