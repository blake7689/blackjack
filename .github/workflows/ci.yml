# CI for the React app. Adjust node-version and scripts to match package.json.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Lets the Static Web App deploy workflow run this as its test gate.
  workflow_call:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      # Fails below 100% line, branch, function or statement coverage (thresholds in vite.config.js).
      - name: Tests with the 100% coverage gate
        run: npm run coverage
        env:
          CI: true
      - run: npm run build

  # Playwright smoke tests against a route-stubbed API (playwright.config.js builds and serves the app).
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 12 # install (<= 4) + tests (<= 8)
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, phone] # one leg per Playwright project; the deploy gate waits for both (#146)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium shell only, no browser cache (Playwright's CI guide).
      - run: bash scripts/install-playwright-browser.sh
        timeout-minutes: 4 # normally 15-40 s; the script retries 2x at 105 s each (#123, #127)
      - run: npx playwright test --project=${{ matrix.project }}
        timeout-minutes: 8 # globalTimeout is 7 min; fails the step before the 12-min job limit
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
