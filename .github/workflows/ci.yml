# CI for the React app. Adjust node-version and scripts to match package.json.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Lets the Static Web App deploy workflow run this as its test gate.
  workflow_call:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      # Fails below 100% line, branch, function or statement coverage (thresholds in vite.config.js).
      - name: Tests with the 100% coverage gate
        run: npm run coverage
        env:
          CI: true
      - run: npm run build

  # Playwright smoke tests against a route-stubbed API (playwright.config.js builds and serves the app).
  e2e:
    name: e2e (${{ matrix.project }}${{ matrix.shard && format(' {0}/2', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20 # install (<= 4) + tests (<= 15)
    strategy:
      fail-fast: false
      matrix:
        # One leg per Playwright project; the deploy gate waits for all (#146, #167).
        # webkit is 2 shards: unsharded it ran up to the 14-min globalTimeout (#208).
        include:
          - project: chromium
          - project: phone
          - project: webkit
            shard: 1
          - project: webkit
            shard: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The leg's own browser only, no browser cache (Playwright's CI guide): the script's default is the Chromium shell; the webkit legs override it (#167).
      - run: bash scripts/install-playwright-browser.sh
        env:
          PW_INSTALL_CMD: ${{ matrix.project == 'webkit' && 'npx playwright install --with-deps webkit' || '' }}
        timeout-minutes: 4 # normally 15-40 s; the script retries 2x at 90 s each (#123, #127)
      - run: npx playwright test --project=${{ matrix.project }}${{ matrix.shard && format(' --shard={0}/2', matrix.shard) || '' }}
        timeout-minutes: 15 # globalTimeout is 14 min; fails the step before the 20-min job limit
        env:
          CI: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.project }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
