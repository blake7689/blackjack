# CI for the React app. Adjust node-version and scripts to match package.json.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Lets the Static Web App deploy workflow run this as its test gate.
  workflow_call:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      # Fails below 100% line, branch, function or statement coverage (thresholds in vite.config.js).
      - name: Tests with the 100% coverage gate
        run: npm run coverage
        env:
          CI: true
      - run: npm run build

  # Playwright smoke tests against a route-stubbed API (playwright.config.js builds and serves the app).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium shell only, no browser cache (Playwright's CI guide).
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
